<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroWeather | Authentication</title>
    <link rel="stylesheet" href="styles/index.css">
    <link rel="stylesheet" href="styles/auth.css">
    <link rel="icon" type="image/png" href="images/logo.png">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">
                <img src="images/logo.png" alt="Logo">
                <h1>Agro<span>.</span>weather</h1>
            </div>
            
            <div id="auth-forms">
                <form id="login-form">
                    <h2>Welcome Back</h2>
                    <div class="form-group">
                        <input type="text" id="login-id" placeholder="Username, Email or Phone" required>
                    </div>
                    <div class="form-group">
                        <input type="password" id="login-pass" placeholder="Password" required>
                    </div>
                    <div class="form-options">
                        <label class="checkbox-container">
                            <input type="checkbox" id="keep-signed-in">
                            <span class="checkmark"></span>
                            Keep me signed in
                        </label>
                    </div>
                    <button type="submit" class="auth-btn">Sign In</button>
                    <p class="toggle-text">Don't have an account? <a href="#" id="show-signup">Register</a></p>
                </form>

                <form id="signup-form" style="display: none;">
                    <h2>Create Account</h2>
                    <div class="form-group"><input type="text" id="sign-user" placeholder="Username" required></div>
                    <div class="form-group"><input type="email" id="sign-email" placeholder="Email" required></div>
                    <div class="form-group"><input type="tel" id="sign-phone" placeholder="Phone Number" required></div>
                    <div class="form-group"><input type="password" id="sign-pass" placeholder="Password" required></div>
                    <button type="submit" class="auth-btn btn-signup">Register</button>
                    <p class="toggle-text">Already have an account? <a href="#" id="show-login">Login</a></p>
                </form>
            </div>
        </div>
    </div>
    <script src="scripts/auth.js"></script>
</body>
</html>
