<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroWeather | v1.0</title>
    <link rel="stylesheet" href="styles/index.css">
    <link rel="icon" type="image/png" href="images/logo.png">
</head>
<body>
    <div class="body1">
        <div class="container">
            <header>
                <div class="topl">
                    <div class="logo">
                        <img src="images/logo.png" alt="AgroWeather Logo" class="full">
                    </div>
                    <div class="title">
                        <p>Agro<span class="dot">.</span><span class="weather">weather</span></p>
                    </div>
                </div>
                <div class="topr">
                    <div class="name">
                        <p>Hello, <span class="user">Austine</span></p>
                    </div>
                    <div class="location">
                        <p>Kisii - KE</p>
                    </div>
                </div>
                <div class="profile"></div>
            </header>
        </div>

        <main class="main">
            <div class="mtop ">
                <div class="mtop1 ">
                    <div class="now">
                        <img id="main-icon" src="images/icons/day/01.png" alt="Temperature Icon" class="full">
                    </div>
                    
                </div>



                <div class="mtop2 ">
                    


                    <div class="more-values ">
                        <div class="more-values-inner ">
                            <div class="more-values-1">
                                <div class="more-values-limiter ">
                                    <div class="more-values-icon ">
                                        <svg style="height: 100%;" xmlns="http://www.w3.org/2000/svg" width="800px" height="800px" viewBox="0 0 24 24" fill="none">
                                            <path fill-rule="evenodd" clip-rule="evenodd" d="M6.25 5.5C6.25 3.70508 7.70507 2.25 9.5 2.25C11.2949 2.25 12.75 3.70507 12.75 5.5C12.75 7.29493 11.2949 8.75 9.5 8.75H3C2.58579 8.75 2.25 8.41421 2.25 8C2.25 7.58579 2.58579 7.25 3 7.25H9.5C10.4665 7.25 11.25 6.4665 11.25 5.5C11.25 4.5335 10.4665 3.75 9.5 3.75C8.5335 3.75 7.75 4.5335 7.75 5.5V5.85714C7.75 6.27136 7.41421 6.60714 7 6.60714C6.58579 6.60714 6.25 6.27136 6.25 5.85714V5.5Z" fill="#cccccc"/>
                                            <path opacity="0.4" d="M3.25 14C3.25 13.5858 3.58579 13.25 4 13.25H18.5C20.8472 13.25 22.75 15.1528 22.75 17.5C22.75 19.8472 20.8472 21.75 18.5 21.75C16.1528 21.75 14.25 19.8472 14.25 17.5V17C14.25 16.5858 14.5858 16.25 15 16.25C15.4142 16.25 15.75 16.5858 15.75 17V17.5C15.75 19.0188 16.9812 20.25 18.5 20.25C20.0188 20.25 21.25 19.0188 21.25 17.5C21.25 15.9812 20.0188 14.75 18.5 14.75H4C3.58579 14.75 3.25 14.4142 3.25 14Z" fill="#c8c8c8"/>
                                            <path opacity="0.7" d="M14.25 7.5C14.25 5.15279 16.1528 3.25 18.5 3.25C20.8472 3.25 22.75 5.15279 22.75 7.5C22.75 9.84721 20.8472 11.75 18.5 11.75H2C1.58579 11.75 1.25 11.4142 1.25 11C1.25 10.5858 1.58579 10.25 2 10.25H18.5C20.0188 10.25 21.25 9.01878 21.25 7.5C21.25 5.98122 20.0188 4.75 18.5 4.75C16.9812 4.75 15.75 5.98122 15.75 7.5V8C15.75 8.41421 15.4142 8.75 15 8.75C14.5858 8.75 14.25 8.41421 14.25 8V7.5Z" fill="#cccccc"/>
                                            </svg>
                                    </div>
                                    <div id="temp" class="more-values-bold ">
                                        _ _
                                    </div>
                                    <div class="more-values-faint ">
                                        Temp (°C)
                                    </div>
                                </div>
                            </div>
                            <div class="more-values-s">
                                
                            </div>
                            <div class="more-values-2">
                                <div class="more-values-limiter ">
                                    <div class="more-values-icon ">
                                        <img class="icon" src="images/drop.png" >
                                    </div>
                                    <div id="humidity" class="more-values-bold ">
                                       _ _
                                    </div>
                                    <div class="more-values-faint ">
                                        Humidity
                                    </div>
                                </div>
                            </div>
                            <div class="more-values-s">
                                
                            </div>
                            <div class="more-values-3">
                                <div class="more-values-limiter ">
                                    <div class="more-values-icon ">
                                        <img class="icon" src="images/icons/day/03.png" >
                                    </div>
                                    <div id="rain" class="more-values-bold ">
                                        _ _
                                    </div>
                                    <div class="more-values-faint ">
                                        Rain 
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>


                </div>


                <div class="mtop3 ">

                    <div class="bottom-tiles-cont ">
                            <div  class="tiles ">
                                <div id="next-temp" class="tiles-top ">
                                    _ _˚
                                </div>
                                <div class="tiles-mid ">
                                    <img id="next-icon" class="full" src="images/icons/night/01.png">
                                </div>
                                <div id="next-time" class="tiles-bottom ">
                                    _ _:_ _
                                </div>
                            </div>
                            <div id="now" class="tiles ">
                                <div id="temp-now" class="tiles-top now1">
                                    _ _˚
                                </div>
                                <div class="tiles-mid ">
                                    <img id="current-icon" class="full" src="images/icons/night/02.png">
                                </div>
                                <div id="current-time"  class="tiles-bottom now1">
                                    _ _:_ _
                                </div>
                            </div>
                            <div class="tiles ">
                                <div id="prev-temp" class="tiles-top ">
                                    _ _˚
                                </div>
                                <div class="tiles-mid ">
                                    <img id="prev-icon" class="full" src="images/icons/night/03.png">
                                </div>
                                <div id="prev-time" class="tiles-bottom ">
                                    _ _:_ _
                                </div>
                            </div>
                           
                    </div>
                    
                </div>
            </div>
            <div class="mbottom ">
                <div class="predictions-wrapper" id="crops-wrapper">
                    <div class="predictions-header">
                        <h3>My Crops</h3>
                        <a href="#" class="see-predictions" id="see-predictions">See predictions &#8250;</a>
                    </div>
                    <div class="predictions-cards" id="predictions-cards">
                        <div class="crop-card" data-crop="Maize">
                            <img src="images/maize.png" alt="Maize" class="crop-icon">
                            <div class="crop-name">Maize</div>
                        </div>
                        <div class="crop-card" data-crop="Wheat">
                            <img src="images/wheat.png" alt="Wheat" class="crop-icon">
                            <div class="crop-name">Wheat</div>
                        </div>
                        <div class="crop-card" data-crop="Kidney Beans">
                            <img src="images/kidney beans.png" alt="Kidney Beans" class="crop-icon">
                            <div class="crop-name">Kidney Beans</div>
                        </div>
                        <div class="crop-card" data-crop="Sunflower">
                            <img src="images/sunflower.png" alt="Sunflower" class="crop-icon">
                            <div class="crop-name">Sunflower</div>
                        </div>
                        <div class="crop-card" data-crop="Irish Potatoes">
                            <img src="images/irish potatoes.png" alt="Irish Potatoes" class="crop-icon">
                            <div class="crop-name">Irish Potatoes</div>
                        </div>
                        <div class="crop-card add-crop" id="add-crop-card">
                            <div class="add-sign">+</div>
                        </div>
                    </div>
                    <div class="prediction-insights" id="prediction-insights" hidden>
                        <h4>Insights (next 48h)</h4>
                        <ul id="insights-list" class="insights-list">
                            <li>Loading insights from weather and crop patterns...</li>
                        </ul>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="scripts/script.js"></script>
</body>
</html>
